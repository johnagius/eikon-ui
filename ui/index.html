<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eikon</title>

  <!-- CSS and scripts are attached dynamically with a build stamp (see BUILD below). -->
</head>
<body>
  <div id="eikon-root"></div>

  <noscript style="font-family:system-ui,Arial,sans-serif;padding:16px;display:block;">
    Eikon requires JavaScript enabled.
  </noscript>

  <script>
    (function () {
      "use strict";

      // Bump this when you deploy. It is the only cache-buster: with a fixed value the
      // browser and the Worker's edge cache can reuse every file (previously every load
      // used Date.now(), so 52 files were re-downloaded on every visit).
      // Bump BUILD on EVERY change to any file in ui/: browsers keep stamped files for a day.
      var BUILD = "2026-11-02.14";

      function log() { try { console.log.apply(console, arguments); } catch (e) {} }
      function warn() { try { console.warn.apply(console, arguments); } catch (e) {} }

      function withParams(src) {
        var sep = src.indexOf("?") >= 0 ? "&" : "?";
        return src + sep + "v=" + encodeURIComponent(BUILD);
      }

      function loadCss(href) {
        return new Promise(function (resolve, reject) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = href;
          l.onload = function () { resolve(); };
          l.onerror = function (e) { warn("[EIKON][boot] CSS FAILED:", href, e); reject(new Error("CSS failed: " + href)); };
          document.head.appendChild(l);
        });
      }

      // Scripts are inserted all at once with async=false: the browser downloads them in
      // parallel and still executes them in this order.
      function loadScriptsInOrder(srcs) {
        return new Promise(function (resolve, reject) {
          var remaining = srcs.length;
          var failed = false;
          srcs.forEach(function (src) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false;
            s.onload = function () {
              remaining -= 1;
              if (!failed && remaining === 0) resolve();
            };
            s.onerror = function (e) {
              if (failed) return;
              failed = true;
              warn("[EIKON][boot] JS FAILED:", src, e);
              reject(new Error("Script failed to load: " + src));
            };
            document.head.appendChild(s);
          });
        });
      }

      // Spreadsheet library for imports. Loaded in the background and never allowed to
      // block or break the app: the modules that need it check window.XLSX when used.
      function loadOptionalScript(src) {
        try {
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onerror = function () { warn("[EIKON][boot] optional script failed (imports disabled until reload):", src); };
          document.head.appendChild(s);
        } catch (e) {}
      }

      var root = document.getElementById("eikon-root");
      if (root) {
        // While the code loads: the wordmark, centred, with a thin moving line. No timer; it goes as soon as the app is ready.
        root.innerHTML =
          '<style>@keyframes eikonLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}' +
          '#eikon-boot{position:fixed;inset:0;display:grid;place-items:center;background:#0b0f16;color:#e9eef7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}' +
          '#eikon-boot .w{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;position:relative}' +
          '#eikon-boot .w i{position:absolute;left:0;right:0;height:2px;background:#0b0f16}' +
          '#eikon-boot .l{width:96px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin:18px auto 0}' +
          '#eikon-boot .l b{display:block;width:40%;height:100%;border-radius:2px;background:#4ea1ff;animation:eikonLoad 1.1s ease-in-out infinite}</style>' +
          '<div id="eikon-boot" role="status" aria-label="Loading Eikon"><div><div class="w">eikon<i style="top:44%"></i><i style="top:62%"></i></div><div class="l"><b></b></div></div></div>';
      }

      var MODULES = [
        "./core.js",
        "./help-content.js",
        "./modules.dashboard.js",
        "./modules.today.js",
        "./modules.customers.js",
        "./modules.bookings.js",
        "./modules.hubs.js",
        "./modules.alerts.js",
        "./modules.shifts.js",
        "./modules.ocps.js",
        "./modules.loyalty.js",
        "./modules.pharmacycalc.js",
        "./modules.returns.js",
        "./modules.paidout.js",
        "./modules.stocktransfers.js",
        "./modules.scarcestock.js",
        "./modules.nearexpiry.js",
        "./modules.locumreceipts.js",
        "./modules.instructions.js",
        "./modules.clientorders.js",
        "./modules.poct.js",
        "./modules.endofday.js",
        "./modules.temperature.js",
        "./modules.cleaning.js",
        "./modules.certificates.js",
        "./modules.dailyregister.js",
        "./modules.repeatprescriptions.js",
        "./modules.ddasales.js",
        "./modules.ddapoyc.js",
        "./modules.ddapurchases.js",
        "./modules.ddastocktakes.js",
        "./modules.locumregister.js",
        "./modules.vaccines.js",
        "./modules.creditnotes.js",
        "./modules.tickets.js",
        "./modules.deliveries.js",
        "./modules.appointments.js",
        "./modules.quotations.js",
        "./modules.orderdiary.js",
        "./modules.emergencypos.js",
        "./modules.audit.js",
        "./modules.messageboard.js",
        "./modules.pharmacovigilance.js",
        "./modules.screening.js",
        "./modules.otcmindmap.js",
        "./modules.labels.js",
        "./modules.contacts.js",
        "./modules.supplier-dashboard.js",
        "./modules.supplier-products.js",
        "./modules.supplier-received-orders.js",
        "./modules.supplier-order-feedback.js",
        "./modules.supplier-inventory.js",
        "./modules.company-dashboard.js",
        "./modules.admin-overview.js",
        "./modules.cherubino-orders.js",
        "./modules.cherubino-admin.js",
        "./modules.cherubino-prices.js",
        "./modules.cherubino-shortexpiry.js",
        "./modules.cherubino-oos.js",
        "./main.js"
      ].map(withParams);

      loadOptionalScript("https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js");

      loadCss(withParams("./app.css"))
        .then(function () { return loadScriptsInOrder(MODULES); })
        .then(function () { log("[EIKON][boot] loaded build", BUILD); })
        .catch(function (e) {
          warn("[EIKON][boot] Boot failed:", e);
          if (root) {
            root.innerHTML =
              '<div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:18px;">' +
              '<div style="font-size:18px;font-weight:800;margin-bottom:6px;color:#b00020;">Eikon failed to load</div>' +
              '<div style="margin-bottom:10px;">Check the connection and reload the page. If it keeps happening, tell us the message below.</div>' +
              '<div style="white-space:pre-wrap;background:#fff;color:#111;border:1px solid #ddd;padding:12px;border-radius:10px;">' +
              String(e && (e.message || e)) +
              "</div></div>";
          }
        });
    })();
  </script>
</body>
</html>
