<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Eikon</title>
  <!-- Add to Home Screen: opens full-screen with its own icon, like an app. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Eikon" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F2F2F7" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <script>
    // Clean addresses (eikonhq.com/today): the worker marks the page it serves outside /ui/ with
    // <meta name="eikon-ui-base" content="/ui/">, and every file is then fetched from /ui/. Without the mark
    // (opened as /ui/index.html anywhere) nothing changes: relative files and #hash screens, as before.
    (function () { var b = ""; try { var m = document.querySelector('meta[name="eikon-ui-base"]'); if (m && /^\/[\w\/-]*\/$/.test(m.getAttribute("content") || "")) b = m.getAttribute("content"); } catch (e) {}
      window.EIKON_UI_BASE = b;
      if (b) { if (!window.EIKON_PRODUCTMAP_BASE) window.EIKON_PRODUCTMAP_BASE = b.replace(/\/$/, ""); // read by the OTC map modules
        try { var ic = document.querySelector('link[rel="apple-touch-icon"]'); if (ic) ic.setAttribute("href", b + "assets/icon-180.png"); } catch (e) {} } })();
    // An old eikonhq.com/ui/index.html#endofday link, opened in a browser tab, moves to eikonhq.com/endofday.
    // Not inside a frame, not in the home-screen app (its scope is /ui/), not on any other host.
    (function () { try {
      if (window.EIKON_UI_BASE || !/^(www\.)?eikonhq\.com$/i.test(location.hostname) || !/^\/ui\/(index\.html)?$/.test(location.pathname)) return;
      if (window.top !== window || navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)) return;
      var h = String(location.hash || "").replace(/^#/, "");
      if (h && !/^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(h)) return;
      // Once per 20 s: a worker without clean addresses sends "/" back here, and this must not go round in a loop.
      var t = Number(sessionStorage.getItem("eikon_clean_try") || 0); if (Date.now() - t < 20000) return;
      sessionStorage.setItem("eikon_clean_try", String(Date.now()));
      window.EIKON_LEAVING = true; location.replace("/" + h + location.search);
    } catch (e) {} })();
    // The old address (eikon-api.labrint.workers.dev) moves a browser TAB to eikonhq.com, same screen and query.
    // The worker moves /, /ui/ and /today-style paths itself; /ui/index.html is moved here because only the page can
    // tell a tab from an app installed on a home screen or desktop from the old address (whose start_url it is):
    // never in a frame (swiftdataautomation.com), never in an installed app, never with ?stay=1.
    (function () { try {
      if (window.EIKON_LEAVING || location.hostname !== "eikon-api.labrint.workers.dev") return;
      if (/[?&]stay=1(&|$)/.test(location.search) || window.top !== window || navigator.standalone === true) return;
      if (window.matchMedia && window.matchMedia("(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui), (display-mode: window-controls-overlay)").matches) return;
      var to = location.pathname + location.search + location.hash, h = String(location.hash || "").replace(/^#/, "");
      if (/^\/ui\/(index\.html)?$/.test(location.pathname) && (!h || /^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(h))) to = "/" + h + location.search; // straight to eikonhq.com/endofday
      window.EIKON_LEAVING = true; location.replace((location.protocol === "http:" ? "http:" : "https:") + "//eikonhq.com" + to);
    } catch (e) {} })();
    // A home-screen app keeps its own storage, so the new layout installs through next.html. On eikonhq.com's clean
    // address the app installs as eikonhq.com itself (start_url and scope "/", manifest-clean.json).
    (function () { var l = document.createElement("link"); l.rel = "manifest"; var n = false;
      try { n = localStorage.getItem("eikon_ui2") !== "0"; } catch (e) {}
      var clean = !!window.EIKON_UI_BASE && /^(www\.)?eikonhq\.com$/i.test(location.hostname);
      l.href = (window.EIKON_UI_BASE || "") + (clean ? "manifest-clean.json" : n ? "manifest-next.json" : "manifest.json"); document.head.appendChild(l);
      // Install offer (eikon.install.js): the browser's install prompt is kept for our own card, which asks once after
      // sign-in. Only on the clean address in the new layout, and not once the person said "Don't ask again".
      if (!clean) return;
      window.addEventListener("beforeinstallprompt", function (ev) { try {
        var q = new URLSearchParams(location.search).get("ui");
        var light = q === "2" || (q !== "1" && q !== "classic" && localStorage.getItem("eikon_ui2") !== "0" && sessionStorage.getItem("eikon_ui2_pause") !== "1" && (!localStorage.getItem("eikon_active_role") || localStorage.getItem("eikon_active_role") === "pharmacy"));
        if (!light || localStorage.getItem("eikon_install_never") === "1") return;
        ev.preventDefault(); window.EIKON_BIP = ev; window.dispatchEvent(new Event("eikon:installable"));
      } catch (e) {} });
      window.addEventListener("appinstalled", function () { try { localStorage.setItem("eikon_install_done", "1"); } catch (e) {} });
    })();
  </script>

  <!-- CSS and scripts are attached dynamically with a build stamp (see BUILD below). -->
</head>
<body>
  <div id="eikon-root"></div>

  <noscript style="font-family:system-ui,Arial,sans-serif;padding:16px;display:block;">
    Eikon requires JavaScript enabled.
  </noscript>

  <script>
    (function () {
      "use strict";

      // Bump this when you deploy. It is the only cache-buster: with a fixed value the
      // browser and the Worker's edge cache can reuse every file (previously every load
      // used Date.now(), so 52 files were re-downloaded on every visit).
      // Bump BUILD on EVERY change to any file in ui/: browsers keep stamped files for a day.
      var BUILD = "2026-11-03.141";
      if (window.EIKON_LEAVING) return; // moving to the clean address (see the head)

      function log() { try { console.log.apply(console, arguments); } catch (e) {} }
      function warn() { try { console.warn.apply(console, arguments); } catch (e) {} }

      // Clean addresses (see the head): files come from /ui/; otherwise "./core.js" exactly as before.
      var UIB = window.EIKON_UI_BASE || "";
      function fromUi(src) { return UIB ? UIB + String(src).replace(/^\.\//, "") : src; }

      function withParams(src) {
        var sep = src.indexOf("?") >= 0 ? "&" : "?";
        return src + sep + "v=" + encodeURIComponent(BUILD);
      }

      function loadCss(href) {
        return new Promise(function (resolve, reject) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = href;
          l.onload = function () { resolve(); };
          l.onerror = function (e) { warn("[EIKON][boot] CSS FAILED:", href, e); reject(new Error("CSS failed: " + href)); };
          document.head.appendChild(l);
        });
      }

      // Scripts are inserted all at once with async=false: the browser downloads them in
      // parallel and still executes them in this order.
      function loadScriptsInOrder(srcs) {
        return new Promise(function (resolve, reject) {
          var remaining = srcs.length;
          var failed = false;
          srcs.forEach(function (src) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false;
            // core.js draws the sign-in form early; let it go first among the ~60 files.
            if (/\/core\.js\?/.test(src)) try { s.fetchPriority = "high"; s.setAttribute("fetchpriority", "high"); } catch (e) {}
            s.onload = function () {
              remaining -= 1;
              if (!failed && remaining === 0) resolve();
            };
            s.onerror = function (e) {
              if (failed) return;
              failed = true;
              warn("[EIKON][boot] JS FAILED:", src, e);
              reject(new Error("Script failed to load: " + src));
            };
            document.head.appendChild(s);
          });
        });
      }

      var root = document.getElementById("eikon-root");
      // Same decision core.js makes (E.isUi2), taken here before it loads: ?ui=2 / ?ui=1 / ?ui=classic win over what is stored.
      var light = false;
      try {
        var uiParam = new URLSearchParams(location.search).get("ui");
        if (uiParam === "2") light = true;
        else if (uiParam === "1" || uiParam === "classic") light = false;
        else { var role0 = localStorage.getItem("eikon_active_role"); light = localStorage.getItem("eikon_ui2") !== "0" && sessionStorage.getItem("eikon_ui2_pause") !== "1" && (!role0 || role0 === "pharmacy"); }
      } catch (e) {}
      // Signed in and opening on Today: ask who this is and for Today's data now, while the scripts download,
      // instead of after them (one round trip saved). core.js uses these answers once; anything odd and it asks again.
      try {
        var tok0 = localStorage.getItem("eikon_token") || "", h00 = String(location.hash || "").replace(/^#/, "");
        if (window.EIKON_UI_BASE && !h00) h00 = location.pathname.replace(/^\//, ""); // clean address: the screen is the path
        if (tok0 && light && window.fetch && (h00 === "" || h00 === "today" || h00 === "dashboard") && localStorage.getItem("eikon_active_role") === "pharmacy") {
          var early0 = function (path) { return fetch(path, { headers: { Authorization: "Bearer " + tok0 } }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); };
          window.EIKON_EARLY = { at: Date.now(), token: tok0, me: early0("/auth/me"), today: early0("/today") };
        }
      } catch (e) {}
      if (root) {
        // While the code loads: the wordmark, centred, with a thin moving line. No timer; it goes as soon as the app is ready.
        root.innerHTML =
          '<style>@keyframes eikonLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}' +
          '#eikon-boot{position:fixed;inset:0;display:grid;place-items:center;background:' + (light ? '#F2F2F7;color:#000' : '#0b0f16;color:#e9eef7') + ';font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}' +
          '#eikon-boot .w{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;position:relative}' +
          '#eikon-boot .w i{position:absolute;left:0;right:0;height:2px;background:' + (light ? '#F2F2F7' : '#0b0f16') + '}' +
          '#eikon-boot .l{width:96px;height:3px;border-radius:2px;background:' + (light ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.1)') + ';overflow:hidden;margin:18px auto 0}' +
          '#eikon-boot .l b{display:block;width:40%;height:100%;border-radius:2px;background:' + (light ? '#0A8F6A' : '#4ea1ff') + ';animation:eikonLoad 1.1s ease-in-out infinite}</style>' +
          '<div id="eikon-boot" role="status" aria-label="Loading Eikon"><div><div class="w">eikon<i style="top:44%"></i><i style="top:62%"></i></div><div class="l"><b></b></div></div></div>';
      }

      var MODULES = [
        "./core.js",
        "./eikon.install.js",
        "./eikon.personpick.js",
        "./eikon.people.js",
        "./eikon.search.js",
        "./eikon.months.js",
        "./help-content.js",
        "./modules.dashboard.js",
        "./modules.today.js",
        "./modules.customers.js",
        "./modules.bookings.js",
        "./modules.hubs.js",
        "./modules.tempreg.js",
        "./modules.cleanreg.js",
        "./modules.drreg.js",
        "./modules.locreg.js",
        "./modules.certreg.js",
        "./modules.nexreg.js",
        "./modules.retreg.js",
        "./modules.trfreg.js",
        "./modules.alertreg.js",
        "./modules.ordreg.js",
        "./modules.tktreg.js",
        "./modules.dlvreg.js",
        "./eikon.ddadrugs.js",
        "./modules.cdpreg.js",
        "./modules.cdsreg.js",
        "./modules.ddstreg.js",
        "./modules.poreg.js",
        "./modules.hndreg.js",
        "./modules.rotreg.js",
        "./modules.shfreg.js",
        "./modules.teamreg.js",
        "./modules.repreg.js",
        "./modules.cnreg.js",
        "./modules.lrcreg.js",
        "./modules.odreg.js",
        "./modules.qtreg.js",
        "./modules.ssreg.js",
        "./modules.brdreg.js",
        "./modules.conreg.js",
        "./modules.vaxreg.js",
        "./modules.eodreg.js",
        "./modules.pocreg.js",
        "./modules.scsreg.js",
        "./modules.audreg.js",
        "./modules.expreg.js",
        "./modules.pvreg.js",
        "./modules.scrreg.js",
        "./modules.ocpreg.js",
        "./modules.lblreg.js",
        "./modules.sinreg.js",
        "./modules.otcreg.js",
        "./modules.eposreg.js",
        "./modules.calreg.js",
        "./modules.dupreg.js",
        "./modules.alerts.js",
        "./modules.shifts.js",
        "./modules.ocps.js",
        "./modules.loyalty.js",
        "./modules.pharmacycalc.js",
        "./modules.returns.js",
        "./modules.paidout.js",
        "./modules.stocktransfers.js",
        "./modules.scarcestock.js",
        "./modules.nearexpiry.js",
        "./modules.locumreceipts.js",
        "./modules.instructions.js",
        "./modules.clientorders.js",
        "./modules.poct.js",
        "./modules.endofday.js",
        "./modules.temperature.js",
        "./modules.cleaning.js",
        "./modules.certificates.js",
        "./modules.dailyregister.js",
        "./modules.repeatprescriptions.js",
        "./modules.ddasales.js",
        "./modules.ddapoyc.js",
        "./modules.ddapurchases.js",
        "./modules.ddastocktakes.js",
        "./modules.locumregister.js",
        "./modules.vaccines.js",
        "./modules.creditnotes.js",
        "./modules.tickets.js",
        "./modules.deliveries.js",
        "./modules.appointments.js",
        "./modules.quotations.js",
        "./modules.orderdiary.js",
        "./modules.emergencypos.js",
        "./modules.audit.js",
        "./modules.messageboard.js",
        "./modules.pharmacovigilance.js",
        "./modules.screening.js",
        "./modules.otcmindmap.js",
        "./modules.labels.js",
        "./modules.contacts.js",
        "./modules.supplier-dashboard.js",
        "./modules.supplier-products.js",
        "./modules.supplier-received-orders.js",
        "./modules.supplier-order-feedback.js",
        "./modules.supplier-inventory.js",
        "./modules.company-dashboard.js",
        "./modules.admin-overview.js",
        "./modules.cherubino-orders.js",
        "./modules.cherubino-admin.js",
        "./modules.cherubino-prices.js",
        "./modules.cherubino-shortexpiry.js",
        "./modules.cherubino-oos.js",
        "./main.js"
      ];

      // The classic screens. The new layout never draws them (they open as a ?ui=classic visit, which loads
      // everything below as always), so it does not download them: registry.js lists their names instead, and
      // EIKON_LOAD_CLASSIC() fetches them if this page needs one after all (supplier and company-admin portals).
      var CLASSIC = [
        "./modules.dashboard.js",
        "./modules.alerts.js", "./modules.shifts.js", "./modules.ocps.js", "./modules.loyalty.js", "./modules.pharmacycalc.js",
        "./modules.returns.js", "./modules.paidout.js", "./modules.stocktransfers.js", "./modules.scarcestock.js", "./modules.nearexpiry.js",
        "./modules.locumreceipts.js", "./modules.instructions.js", "./modules.clientorders.js", "./modules.poct.js", "./modules.endofday.js",
        "./modules.temperature.js", "./modules.cleaning.js", "./modules.certificates.js", "./modules.dailyregister.js",
        "./modules.repeatprescriptions.js", "./modules.ddasales.js", "./modules.ddapoyc.js", "./modules.ddapurchases.js",
        "./modules.ddastocktakes.js", "./modules.locumregister.js", "./modules.vaccines.js", "./modules.creditnotes.js",
        "./modules.tickets.js", "./modules.deliveries.js", "./modules.appointments.js", "./modules.quotations.js",
        "./modules.orderdiary.js", "./modules.emergencypos.js", "./modules.audit.js", "./modules.messageboard.js",
        "./modules.pharmacovigilance.js", "./modules.screening.js", "./modules.otcmindmap.js", "./modules.labels.js",
        "./modules.contacts.js", "./modules.supplier-dashboard.js", "./modules.supplier-products.js",
        "./modules.supplier-received-orders.js", "./modules.supplier-order-feedback.js", "./modules.supplier-inventory.js",
        "./modules.company-dashboard.js", "./modules.admin-overview.js", "./modules.cherubino-orders.js",
        "./modules.cherubino-admin.js", "./modules.cherubino-prices.js", "./modules.cherubino-shortexpiry.js", "./modules.cherubino-oos.js"
      ];

      // New layout: start with what Today needs, then load its other screens in the background.
      // The router waits for a late module if one is asked for early.
      var FIRST = ["./core.js", "./eikon.install.js", "./eikon.people.js", "./eikon.search.js", "./modules.today.js", "./modules.customers.js", "./modules.bookings.js", "./modules.hubs.js", "./main.js"];
      var LATER = [], ORDER = [];
      if (light) {
        ORDER = FIRST.concat(MODULES.filter(function (m) { return FIRST.indexOf(m) < 0; })); // the order E.modules had with every file loaded
        LATER = MODULES.filter(function (m) { return FIRST.indexOf(m) < 0 && CLASSIC.indexOf(m) < 0 && m !== "./main.js"; }).concat(["./registry.js"]).map(fromUi).map(withParams);
        MODULES = FIRST.map(fromUi).map(withParams);
        window.EIKON_LATE = new Promise(function (res) { window.__eikonLateDone = res; });
        var classicP = null;
        // Once per page; a failed download can be tried again. Waits for the background files first (they share eikon.ddadrugs.js).
        window.EIKON_LOAD_CLASSIC = function () {
          if (!classicP) classicP = window.EIKON_LATE.then(function () { return loadScriptsInOrder(CLASSIC.map(fromUi).map(withParams)); })
            .then(function () { try { window.EIKON._classicIn = true; } catch (e) {} }, function (e) { classicP = null; throw e; });
          return classicP;
        };
      } else {
        MODULES = MODULES.map(fromUi).map(withParams);
      }

      // Stylesheet and scripts download together (they used to wait for each other: one extra round trip).
      // core.js and main.js wait for window.EIKON_CSS_READY before drawing, so nothing appears unstyled.
      var cssReady = loadCss(withParams(fromUi("./app.css")));
      window.EIKON_CSS_READY = cssReady;
      Promise.all([cssReady, loadScriptsInOrder(MODULES)])
        .then(function () {
          log("[EIKON][boot] loaded build", BUILD);
          if (!LATER.length) return;
          // A late file that fails must not take the app down: the screens that need it say so.
          loadScriptsInOrder(LATER).catch(function (e) { warn("[EIKON][boot] background modules:", e); }).then(function () {
            try { if (window.EIKON && window.EIKON.applyRegistry) window.EIKON.applyRegistry(ORDER); } catch (e) { warn("[EIKON][boot] registry:", e); }
            try { if (window.EIKON) window.EIKON._lateIn = true; window.__eikonLateDone(); window.dispatchEvent(new Event("eikon:modules")); } catch (e) {}
          });
        })
        .catch(function (e) {
          warn("[EIKON][boot] Boot failed:", e);
          if (root) {
            root.innerHTML =
              '<div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:18px;">' +
              '<div style="font-size:18px;font-weight:800;margin-bottom:6px;color:#b00020;">Eikon failed to load</div>' +
              '<div style="margin-bottom:10px;">Check the connection and reload the page. If it keeps happening, tell us the message below.</div>' +
              '<div style="white-space:pre-wrap;background:#fff;color:#111;border:1px solid #ddd;padding:12px;border-radius:10px;">' +
              String(e && (e.message || e)) +
              "</div></div>";
          }
        });
    })();
  </script>
</body>
</html>
