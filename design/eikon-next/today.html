<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eikon · Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
/* ═════════════ Tokens: iOS / macOS 26 semantics. Colour means something or it is not used. ═════════════ */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.07);
  --label:#000; --label-2:rgba(60,60,67,.64); --label-3:rgba(60,60,67,.42);
  --sep:rgba(60,60,67,.15);
  --tint:#0A8F6A; --tint-ink:#fff; --tint-soft:rgba(10,143,106,.11);
  --red:#D7261C; --red-soft:rgba(255,59,48,.10); --orange:#C46200; --orange-soft:rgba(255,149,0,.13);
  --glyph-bg:rgba(118,118,128,.10); --glyph-fg:rgba(60,60,67,.78);
  --glass:rgba(250,250,252,.82); --glass-line:rgba(255,255,255,.75); --glass-shadow:0 10px 40px rgba(0,0,0,.10),0 1px 0 rgba(0,0,0,.04);
  --r-card:22px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1C1C1E; --fill:rgba(118,118,128,.26); --fill-2:rgba(118,118,128,.16);
  --label:#fff; --label-2:rgba(235,235,245,.64); --label-3:rgba(235,235,245,.40);
  --sep:rgba(84,84,88,.6);
  --tint:#32D39C; --tint-ink:#00261B; --tint-soft:rgba(50,211,156,.15);
  --red:#FF5A50; --red-soft:rgba(255,69,58,.17); --orange:#FFA733; --orange-soft:rgba(255,159,10,.17);
  --glyph-bg:rgba(118,118,128,.22); --glyph-fg:rgba(235,235,245,.85);
  --glass:rgba(30,30,32,.80); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 10px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.c2{color:var(--label-2)} .c3{color:var(--label-3)}

/* ═════════════ Type ═════════════ */
.t-large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.022em}
.t-title3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.012em}
.t-head{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.008em}
.t-sub{font-size:15px;line-height:20px;letter-spacing:-.004em}
.t-foot{font-size:13px;line-height:18px}

/* ═════════════ Pieces ═════════════ */
.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.sec-h h2{font-size:20px;line-height:25px;font-weight:700;letter-spacing:-.012em}
.sec-h a{font-size:15px;color:var(--tint);font-weight:500;text-decoration:none}
.group{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 16px;position:relative}
.group > .row + .row::before,.group > .head + .row::before{content:"";position:absolute;top:0;right:0;left:66px;height:.5px;background:var(--sep)}
.group > .head + .row::before{left:16px;right:16px}
.txt{flex:1;min-width:0}
.txt > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyph{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--glyph-bg);color:var(--glyph-fg)}
.glyph svg{width:20px;height:20px}
.glyph.red{background:var(--red-soft);color:var(--red)}
.glyph.orange{background:var(--orange-soft);color:var(--orange)}
.glyph.done{background:var(--tint-soft);color:var(--tint)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:15px;color:#fff}
.chev{color:var(--label-3);width:8px;height:14px;flex:none}
.btn{height:34px;padding:0 15px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn-fill{background:var(--tint);color:var(--tint-ink)}
.btn-tint{background:var(--tint-soft);color:var(--tint)}
.btn-gray{background:var(--fill);color:var(--label)}
.btn-red{background:var(--red);color:#fff}
.btn-lg{height:50px;border-radius:25px;padding:0 22px;font-size:17px;width:100%;justify-content:center}
.done-mark{display:inline-flex;align-items:center;gap:4px;color:var(--tint);font-size:15px;font-weight:600;flex:none}
.done-mark svg{width:15px;height:15px}

/* Checklist header */
.head{display:flex;align-items:center;gap:14px;padding:16px 16px 14px}
.ring{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--tint) calc(var(--p)*360deg),var(--fill) 0);position:relative}
.ring::after{content:"";width:35px;height:35px;border-radius:50%;background:var(--surface)}
.ring b{position:absolute;font-size:12px;font-weight:700}

/* Temperature entry */
.temp{display:flex;gap:8px;align-items:center;flex:none}
.well{width:76px;height:40px;border-radius:12px;background:var(--fill-2);display:flex;align-items:center;gap:7px;padding:0 11px;border:1.5px solid transparent}
.well span{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--label-2)}
.well b{font-size:17px;font-weight:600}
.well b.empty{color:var(--label-3);font-weight:500}
.well.focus{border-color:var(--tint);background:var(--surface)}
.well.bad{border-color:var(--red);background:var(--red-soft)}
.well.bad b{color:var(--red)}
.ok{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;flex:none}
.ok svg{width:18px;height:18px}
.ok.off{visibility:hidden}
.warnline{display:flex;align-items:center;gap:8px;color:var(--red);font-size:13px;font-weight:600;line-height:18px}
.warnline svg{width:15px;height:15px;flex:none}
.row.stack{flex-wrap:wrap;row-gap:10px}
.row.stack > .temp,.row.stack > .after{width:100%;padding-left:50px}
.row.stack > .temp .well{flex:1;height:44px}
.row.stack > .temp .ok{width:44px;height:44px}
.row.stack > .temp .ok.off{display:none}
.row.alertwrap{flex-wrap:wrap;row-gap:10px}
.row.alertwrap > .after{width:100%;padding-left:50px}
.after{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Hero cards */
.hero{padding:18px 18px 18px}
.hero .t-title3{margin-bottom:3px}
.steps{display:flex;flex-direction:column;gap:10px;margin:16px 0 18px}
.step{display:flex;align-items:center;gap:12px;font-size:15px}
.step i{width:24px;height:24px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--label-2);flex:none}

/* Toast (undo) */
.toast{position:fixed;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;height:52px;padding:0 8px 0 18px;border-radius:26px;font-size:15px;font-weight:500;white-space:nowrap;z-index:5}
.toast svg{width:18px;height:18px;color:var(--tint)}
.toast .btn{height:36px}

/* Glass */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);border:.5px solid var(--glass-line);box-shadow:var(--glass-shadow)}

/* ═════════════ iPhone ═════════════ */
.phone{max-width:440px;margin:0 auto;min-height:100vh;padding:0 16px 130px}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px 6px 18px;font-size:17px;font-weight:600}
.ph-head{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 4px 16px}
.me{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;font-weight:700;font-size:13px;margin-bottom:6px}
.fade{position:fixed;left:0;right:0;bottom:0;height:140px;background:linear-gradient(to top,var(--bg) 35%,transparent);pointer-events:none}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;display:flex;gap:10px;align-items:center;width:min(408px,calc(100% - 32px))}
.tabs{flex:1;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;min-width:66px;padding:6px 0;border-radius:24px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--tint);background:var(--fill-2)}
.searchbtn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.searchbtn svg{width:24px;height:24px}
.phone .toast{bottom:100px}

/* ═════════════ Desktop ═════════════ */
.desk{display:none}
@media (min-width:900px){ .phone{display:none} .desk{display:grid;grid-template-columns:256px 1fr;min-height:100vh} }
.side{position:sticky;top:0;height:100vh;padding:14px}
.side-in{height:100%;border-radius:24px;padding:18px 12px 14px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;color:var(--label);font-size:15px;font-weight:500;text-decoration:none}
.nav a svg{width:20px;height:20px;color:var(--label-2)}
.nav a.on{background:var(--tint-soft);color:var(--tint);font-weight:600}
.nav a.on svg{color:var(--tint)}
.side .who{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:.5px solid var(--sep);margin-top:10px}
.side .who .me{margin:0;width:32px;height:32px}
.main{padding:28px 40px 60px 28px;max-width:1220px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}
.spot{width:380px;height:40px;border-radius:20px;display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--label-2);font-size:15px;margin-bottom:2px}
.spot svg{width:17px;height:17px}
.spot kbd{margin-left:auto;font:600 12px var(--font);color:var(--label-3);background:var(--fill-2);border-radius:6px;padding:2px 7px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.desk .toast{bottom:28px;left:calc(50% + 128px)}
.stat{display:grid;grid-template-columns:repeat(3,1fr)}
.stat > div{padding:16px 16px 14px}
.stat > div + div{border-left:.5px solid var(--sep)}
.stat b{display:block;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19M8 7.5h7M8 11h5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2.8 8.5 4.6v9.2L12 21.2l-8.5-4.6V7.4z"/><path d="m3.8 7.6 8.2 4.5 8.2-4.5M12 12.1v9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
  <symbol id="i-team" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></symbol>
  <symbol id="i-snow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></symbol>
  <symbol id="i-therm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.6 3.9 2.1 5.4 6 6-3.9.6-5.4 2.1-6 6-.6-3.9-2.1-5.4-6-6 3.9-.6 5.4-2.1 6-6z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5.5c0 4.4 3 8 7 9.5 4-1.5 7-5.1 7-9.5V6z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M12 13c-4.5 0-7-2.5-7-7 4.5 0 7 2.5 7 7zM12 11c0-4 2.2-6.5 7-6.5 0 4.6-2.5 6.5-7 6.5z"/></symbol>
</defs></svg>

<div id="app"></div>

<script>
/* ───────── One model, three moments of the day. ?scene=morning|day|evening  ?theme=light|dark ───────── */
const Q = new URLSearchParams(location.search);
const SCENE = Q.get("scene") || "morning";
document.documentElement.dataset.theme = Q.get("theme") ? Q.get("theme") : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

const ic = (id, cls="") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const av = (ini, col, size) => `<div class="avatar" style="background:${col}${size?`;width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px`:""}">${ini}</div>`;

const S = { morning:{time:"08:24"}, day:{time:"14:32"}, evening:{time:"18:41"} }[SCENE];
const DATE = "Monday 2 November";

/* ---------- Opening checks ---------- */
function checks(compact) {
  if (SCENE !== "morning") {
    return `<div class="group"><div class="row">
      <div class="glyph done">${ic("check")}</div>
      <div class="txt"><div class="t-head">Opening checks done</div><div class="t-foot c2 num">${compact ? "Signed by Maria at 08:31" : "Fridge 3.6–6.1 · dispensary 19–22 · signed by Maria at 08:31"}</div></div>
      ${ic("chev","chev")}</div></div>`;
  }
  const stack = compact ? " stack" : "";
  return `<div class="group">
    <div class="head">
      <div class="ring" style="--p:.25"><b class="num">1/4</b></div>
      <div class="txt"><div class="t-title3">Before you open</div><div class="t-foot c2">Two readings and your signature.</div></div>
    </div>
    <div class="row${compact ? " stack" : " alertwrap"}">
      <div class="glyph red">${ic("snow")}</div>
      <div class="txt"><div class="t-head">Fridge</div><div class="t-foot c2 num">Keep 2–8 °C · yesterday 3.4 to 6.3</div></div>
      <div class="temp"><div class="well"><span>Min</span><b class="num">3.6</b></div><div class="well bad"><span>Max</span><b class="num">8.9</b></div><button class="ok off">${ic("check")}</button></div>
      <div class="after"><div class="warnline">${ic("alert")}${compact ? "Above 8 °C" : "Above 8 °C. Note what you did before saving."}</div><button class="btn btn-red">Add note</button></div>
    </div>
    <div class="row${stack}">
      <div class="glyph">${ic("therm")}</div>
      <div class="txt"><div class="t-head">Dispensary</div><div class="t-foot c2 num">Keep 15–25 °C · yesterday 19 to 23</div></div>
      <div class="temp"><div class="well focus"><span>Min</span><b class="empty">—</b></div><div class="well"><span>Max</span><b class="empty">—</b></div><button class="ok off">${ic("check")}</button></div>
    </div>
    <div class="row">
      <div class="glyph">${ic("pen")}</div>
      <div class="txt"><div class="t-head">Daily register</div><div class="t-foot c2">${compact ? "Not signed yet" : "Opening checks and your signature"}</div></div>
      <button class="btn btn-tint">Sign</button>
    </div>
    <div class="row">
      <div class="glyph done">${ic("sparkle")}</div>
      <div class="txt"><div class="t-head">Cleaning</div><div class="t-foot c2">Karl at 08:12</div></div>
      <span class="done-mark">${ic("check")}Done</span>
    </div>
  </div>`;
}

/* ---------- People waiting ---------- */
const WAITING = [
  { ini:"CG", col:"#C9772E", name:"Carmen Grech", what:"Augmentin 625 mg ×14", more:"ready since 09:10 · code A1B2", act:["Hand over","fill"] },
  { ini:"JV", col:"#6461CF", name:"Joseph Vella", what:"Omron M3 question", more:"waiting 3 days", act:["Reply","gray"] },
  { ini:"AZ", col:"#2B9A78", name:"Anna Zammit", what:"Delivery to Sliema", more:"driver leaves at 16:00", act:["Details","gray"] },
  { ini:"PB", col:"#B4566A", name:"Paul Borg", what:"Metformin 850 ×56", more:"ready since 11:40 · code K7P2", act:["Hand over","fill"] },
];
function waiting(compact, list) {
  return `<div class="group">${list.map(w => `<div class="row">
      ${av(w.ini, w.col)}
      <div class="txt"><div class="t-head">${w.name}</div><div class="t-foot c2">${compact ? w.what : w.what + " · " + w.more}</div></div>
      <button class="btn btn-${w.act[1]}">${w.act[0]}</button></div>`).join("")}</div>`;
}

/* ---------- Coming up ---------- */
function upcoming() {
  return `<div class="group">
    <div class="row"><div class="glyph orange">${ic("clock")}</div><div class="txt"><div class="t-head">Enalapril 20 mg</div><div class="t-foot c2">2 packs expire in 12 days</div></div>${ic("chev","chev")}</div>
    <div class="row"><div class="glyph">${ic("shield")}</div><div class="txt"><div class="t-head">Fire extinguisher</div><div class="t-foot c2">Service due Sat 14 Nov</div></div>${ic("chev","chev")}</div>
  </div>`;
}

/* ---------- Closing ---------- */
function closing() {
  return `<div class="group hero">
    <div class="t-title3">Close the day</div>
    <div class="t-foot c2">The till closes at 19:00. About two minutes.</div>
    <div class="steps">
      <div class="step"><i>1</i>Count the cash and cheques</div>
      <div class="step"><i>2</i>Enter the card terminal total</div>
      <div class="step"><i>3</i>Seal the bag, type its number</div>
    </div>
    <button class="btn btn-fill btn-lg">Start closing</button>
  </div>`;
}

/* ---------- Day so far (only figures Eikon actually records) ---------- */
function dayStats() {
  const v = { morning:["0","2","€0"], day:["14","3","€12.50"], evening:["31","1","€12.50"] }[SCENE];
  return `<div class="group stat">
    <div><b class="num">${v[0]}</b><span class="t-foot c2">collected</span></div>
    <div><b class="num">${v[1]}</b><span class="t-foot c2">waiting</span></div>
    <div><b class="num">${v[2]}</b><span class="t-foot c2">paid out</span></div>
  </div>`;
}

const toast = () => SCENE === "day" ? `<div class="toast glass">${ic("check")}Handed to Carmen Grech<button class="btn btn-tint">Undo</button></div>` : "";
const section = (title, body, link) => `<section class="sec">${title ? `<div class="sec-h"><h2>${title}</h2>${link ? `<a href="#">${link}</a>` : ""}</div>` : ""}${body}</section>`;
const listFor = () => SCENE === "day" ? WAITING.slice(1) : SCENE === "evening" ? [WAITING[3]] : WAITING.slice(0, 2);
const waitingTitle = () => SCENE === "evening" ? "Not collected yet" : "Waiting for you";

/* ---------- The order of the screen follows the day ---------- */
function body(compact) {
  const w = section(waitingTitle(), waiting(compact, listFor()), "All");
  if (SCENE === "morning") return section("", checks(compact)) + w + section("Coming up", upcoming());
  if (SCENE === "day")     return w + section("", checks(compact)) + section("Coming up", upcoming());
  return section("", closing()) + w + section("", checks(compact));
}

const tabs = `<div class="fade"></div><div class="tabbar">
  <nav class="tabs glass"><a class="tab on">${ic("today")}Today</a><a class="tab">${ic("people")}Customers</a><a class="tab">${ic("book")}Registers</a><a class="tab">${ic("box")}Stock</a></nav>
  <button class="searchbtn glass">${ic("search")}</button></div>`;

const statusBar = `<div class="status"><span class="num">${S.time.replace(/^0/,"")}</span><span style="display:flex;gap:6px;align-items:center">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2.5" fill="currentColor"/></svg></span></div>`;

const team = () => `<div class="group">
    <div class="row">${av("MB","#0A8F6A",34)}<div class="txt"><div class="t-sub" style="font-weight:600">Maria Borg</div><div class="t-foot c2 num">Pharmacist · 08:00–19:00</div></div></div>
    <div class="row">${av("KC","#B85A45",34)}<div class="txt"><div class="t-sub" style="font-weight:600">Karl Camilleri</div><div class="t-foot c2 num">Assistant · 13:00–19:00</div></div></div>
  </div>`;

const phone = `<div class="phone">${statusBar}
  <div class="ph-head"><div><h1 class="t-large">Today</h1><div class="t-sub c2">${DATE}</div></div><div class="me">MB</div></div>
  ${body(true)}${toast()}${tabs}</div>`;

const desk = `<div class="desk">
  <aside class="side"><div class="side-in glass">
    <div class="brand"><div class="mark">${ic("leaf")}</div><div><div class="t-head">Eikon</div><div class="t-foot c2">Demo Pharmacy</div></div></div>
    <nav class="nav"><a class="on" href="#">${ic("today")}Today</a><a href="#">${ic("people")}Customers</a><a href="#">${ic("book")}Registers</a><a href="#">${ic("box")}Stock</a></nav>
    <div style="flex:1"></div>
    <nav class="nav"><a href="#">${ic("team")}Team</a><a href="#">${ic("gear")}Settings</a></nav>
    <div class="who"><div class="me">MB</div><div><div class="t-sub" style="font-weight:600">Maria Borg</div><div class="t-foot c2">Pharmacist</div></div></div>
  </div></aside>
  <main class="main">
    <div class="top">
      <div><h1 class="t-large">Today</h1><div class="t-sub c2">${DATE} · ${S.time}</div></div>
      <div class="spot glass">${ic("search")}Search anything<kbd>⌘K</kbd></div>
    </div>
    <div class="cols">
      <div>${body(false)}</div>
      <div>${section("", dayStats())}${SCENE === "evening" ? section("Coming up", upcoming()) : section("On today", team())}</div>
    </div>
  </main>${toast()}</div>`;

document.getElementById("app").innerHTML = phone + desk;
</script>
</body>
</html>
