# Eikon API worker. Deploy from this folder with: npx wrangler deploy
# Variables set in the Cloudflare dashboard are kept (keep_vars); secrets are never touched.
name = "eikon-api"
# The source lives in the extensionless file "code"; the build step copies it to
# dist/index.mjs so wrangler and esbuild know it is an ES module.
main = "dist/index.mjs"
compatibility_date = "2026-02-05"
workers_dev = true
keep_vars = true

[build]
command = "mkdir -p dist && cp code dist/index.mjs"
watch_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "eikon_db"
database_id = "049c6f25-93b7-4513-909d-a43fb53988cc"

[vars]
# Which GitHub branch the /ui/* files are served from. "main" for production;
# a feature branch for a pilot. Dashboard values for other variables are kept.
UI_GITHUB_BRANCH = "main"
# UI files carry a fixed build stamp (index.html BUILD), so they can be cached.
UI_CACHE_SECONDS = "300"
# One-click public demo ("Try the demo" on the sign-in screen; DEMO.md). Off when DEMO_ORG_ID or DEMO_LOCATION_ID is
# missing. The demo group (org 2) holds the demo pharmacy (location 2, live) and, made by the first reset when free,
# a second pharmacy (399), a distributor (599, the supplier portal) and a head office (899, the company-admin portal).
# A configured id that belongs to another group is never touched (that door stays shut). Delete these five lines,
# after POST /su/api/demo/wipe, to switch the demo off.
DEMO_ORG_ID = "2"
DEMO_LOCATION_ID = "2"
DEMO_PHARMACY2_LOCATION_ID = "399"
DEMO_SUPPLIER_LOCATION_ID = "599"
DEMO_HQ_LOCATION_ID = "899"

# Booking reminders (the evening before / N hours before): the worker's scheduled() runs every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]
